name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run coverage
      - run: npm run package
      - run: npm run test:package
  ci-ok:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "CI passed"
